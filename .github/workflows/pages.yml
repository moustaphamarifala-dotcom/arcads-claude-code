name: Publier le site sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Les deux outils autonomes sont de simples fichiers HTML : on les copie tels quels.
      - name: Préparer les fichiers à publier
        run: |
          mkdir -p site
          cp public/personnes.html site/index.html
          cp public/personnes.html site/personnes.html
          cp public/business.html site/business.html
          touch site/.nojekyll

      # GitHub publie la branche gh-pages. On y pousse le dossier site/ tel quel.
      - name: Publier sur la branche gh-pages
        env:
          JETON: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site statique — ${GITHUB_SHA:0:7}"
          git push -f "https://x-access-token:${JETON}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
