<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101320">
<title>Studio TikTok — diagnostic et vente</title>

<style>
  :root {
    --ground: #101320;
    --surface: #191d2d;
    --surface-2: #212639;
    --line: #2e3348;
    --ink: #eaebf2;
    --ink-soft: #949ab4;
    --brass: #d9a441;
    --brass-ink: #f0c069;
    --brass-soft: rgba(217, 164, 65, 0.13);
    --crit: #e5565b;
    --warn: #dd8b3a;
    --mid: #c9ac4e;
    --ok: #46a86c;
    --r: 14px;
    --serif: Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, monospace;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --ground: #f1f2f7;
      --surface: #ffffff;
      --surface-2: #f7f8fb;
      --line: #dcdfe9;
      --ink: #171a26;
      --ink-soft: #5b6278;
      --brass: #9a6f16;
      --brass-ink: #7d5a0f;
      --brass-soft: rgba(154, 111, 22, 0.09);
      --crit: #c4353a;
      --warn: #a9631b;
      --mid: #8a7420;
      --ok: #2c7d4b;
    }
  }

  :root[data-theme="dark"] {
    --ground: #101320;
    --surface: #191d2d;
    --surface-2: #212639;
    --line: #2e3348;
    --ink: #eaebf2;
    --ink-soft: #949ab4;
    --brass: #d9a441;
    --brass-ink: #f0c069;
    --brass-soft: rgba(217, 164, 65, 0.13);
    --crit: #e5565b;
    --warn: #dd8b3a;
    --mid: #c9ac4e;
    --ok: #46a86c;
  }

  :root[data-theme="light"] {
    --ground: #f1f2f7;
    --surface: #ffffff;
    --surface-2: #f7f8fb;
    --line: #dcdfe9;
    --ink: #171a26;
    --ink-soft: #5b6278;
    --brass: #9a6f16;
    --brass-ink: #7d5a0f;
    --brass-soft: rgba(154, 111, 22, 0.09);
    --crit: #c4353a;
    --warn: #a9631b;
    --mid: #8a7420;
    --ok: #2c7d4b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
  }

  .app { max-width: 560px; margin: 0 auto; padding: 0 16px 64px; }

  header { padding: 28px 0 18px; }

  h1 {
    font-family: var(--serif);
    font-size: 1.7rem;
    line-height: 1.2;
    margin: 0 0 6px;
    text-wrap: balance;
  }
  h1 em { color: var(--brass); font-style: italic; }

  .sous { color: var(--ink-soft); font-size: 0.94rem; margin: 0; }

  /* ── Navigation : rangée défilante, collée en haut ─────────────── */
  nav {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    gap: 7px;
    overflow-x: auto;
    padding: 10px 16px;
    margin: 0 -16px 18px;
    background: color-mix(in srgb, var(--ground) 92%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    scrollbar-width: none;
  }
  nav::-webkit-scrollbar { display: none; }

  .chip {
    flex: 0 0 auto;
    padding: 8px 15px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    font-size: 0.88rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip[aria-selected="true"] {
    background: var(--brass-soft);
    border-color: var(--brass);
    color: var(--brass-ink);
    font-weight: 600;
  }
  .chip:focus-visible, button:focus-visible, input:focus-visible,
  select:focus-visible, textarea:focus-visible, a:focus-visible {
    outline: 2px solid var(--brass);
    outline-offset: 2px;
  }

  /* ── Cartes ────────────────────────────────────────────────────── */
  .carte {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r);
    padding: 18px;
    margin-bottom: 14px;
  }
  .carte.liseré { border-left-width: 4px; }

  h2 {
    font-family: var(--serif);
    font-size: 1.13rem;
    margin: 0 0 6px;
    font-weight: 600;
    text-wrap: balance;
  }
  .aide { color: var(--ink-soft); font-size: 0.89rem; margin: 0 0 15px; }
  .aide:last-child { margin-bottom: 0; }

  /* ── Formulaires ───────────────────────────────────────────────── */
  .grille { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 430px) { .grille { grid-template-columns: 1fr; } }

  .champ { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
  .champ:last-child { margin-bottom: 0; }
  .champ > label { color: var(--ink-soft); font-size: 0.83rem; }
  .champ .note { color: var(--ink-soft); font-size: 0.78rem; line-height: 1.45; }

  input, select, textarea {
    width: 100%;
    font: inherit;
    color: var(--ink);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 11px 12px;
  }
  input[type="number"] { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  textarea { resize: vertical; min-height: 76px; line-height: 1.5; }
  input:focus, select:focus, textarea:focus { border-color: var(--brass); }

  .btn {
    font: inherit;
    font-weight: 600;
    border: none;
    border-radius: 9px;
    padding: 11px 20px;
    background: var(--brass);
    color: var(--ground);
    cursor: pointer;
  }
  .btn.ghost {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    font-weight: 400;
  }
  .actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 14px; }

  /* ── Métriques ─────────────────────────────────────────────────── */
  .metrique { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .chiffre {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 2.9rem;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .chiffre .u { font-size: 1.1rem; font-weight: 400; }
  .metrique .txt { flex: 1; min-width: 190px; }
  @media (max-width: 460px) {
    .metrique { flex-direction: column; align-items: flex-start; gap: 10px; }
    .metrique .txt { min-width: 0; }
  }

  .pastille {
    display: inline-block;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    border: 1px solid currentColor;
    margin-bottom: 5px;
  }

  .encadre {
    text-align: center;
    padding: 20px;
    border: 1px solid var(--brass);
    background: var(--brass-soft);
    border-radius: var(--r);
    margin: 16px 0;
  }
  .encadre .chiffre { color: var(--brass); font-size: 2.2rem; }
  .encadre .lg { color: var(--ink-soft); font-size: 0.86rem; margin-top: 7px; }

  /* ── Lignes de données ─────────────────────────────────────────── */
  .ligne {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 14px;
    padding: 11px 0;
    border-bottom: 1px solid var(--line);
  }
  .ligne:last-child { border-bottom: none; }
  .ligne .lbl { font-weight: 600; font-size: 0.94rem; }
  .ligne .det { color: var(--ink-soft); font-size: 0.79rem; }
  .ligne .val {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    white-space: nowrap;
  }

  .jauge { height: 5px; border-radius: 999px; background: var(--line); overflow: hidden; margin: 9px 0 11px; }
  .jauge i { display: block; height: 100%; border-radius: 999px; }

  ul.pts { list-style: none; margin: 0; padding: 0; font-size: 0.88rem; }
  ul.pts li { position: relative; padding-left: 20px; margin-bottom: 5px; line-height: 1.5; }
  ul.pts li.oui::before { content: "✓"; position: absolute; left: 0; color: var(--ok); }
  ul.pts li.non::before { content: "→"; position: absolute; left: 0; color: var(--brass); }

  .coche { display: flex; gap: 11px; align-items: flex-start; cursor: pointer; }
  .coche input { width: 19px; height: 19px; flex: 0 0 auto; margin-top: 2px; accent-color: var(--brass); }
  .coche .q { font-weight: 600; font-size: 0.93rem; line-height: 1.45; }

  .bloc-tags {
    font-family: var(--mono);
    font-size: 0.92rem;
    line-height: 1.75;
    color: var(--brass-ink);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    word-break: break-word;
  }
  .lien-wa {
    font-family: var(--mono);
    font-size: 0.8rem;
    word-break: break-all;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    color: var(--brass-ink);
  }

  .item { border: 1px solid var(--line); border-radius: 11px; padding: 13px 14px; margin-bottom: 10px; background: var(--surface-2); }
  .item .eyebrow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-soft); }
  .item .cite { font-size: 1rem; line-height: 1.5; margin: 5px 0; }
  .item .pourquoi { color: var(--ink-soft); font-size: 0.84rem; line-height: 1.5; }

  .mini {
    font: inherit;
    font-size: 0.8rem;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    border-radius: 7px;
    padding: 5px 12px;
    cursor: pointer;
    margin-top: 9px;
    margin-right: 7px;
  }
  .mini:hover { border-color: var(--brass); color: var(--brass-ink); }

  .jour { display: grid; grid-template-columns: 46px 1fr; gap: 12px; }
  .jour .n {
    font-family: var(--mono);
    font-size: 1.35rem;
    font-weight: 700;
    color: var(--brass);
    text-align: center;
    line-height: 1.1;
  }
  .jour .n small { display: block; font-size: 0.6rem; color: var(--ink-soft); letter-spacing: 0.06em; }

  .rappel {
    color: var(--ink-soft);
    font-size: 0.84rem;
    line-height: 1.6;
    border-left: 2px solid var(--line);
    padding-left: 13px;
    margin-top: 14px;
  }

  footer {
    color: var(--ink-soft);
    font-size: 0.8rem;
    text-align: center;
    padding: 26px 0 8px;
    line-height: 1.6;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>

</head>
<body>
<div class="app">
  <header>
    <h1>Studio <em>TikTok</em></h1>
    <p class="sous">Débloquer la distribution, puis transformer les vues en commandes. Tout est calculé sur ton téléphone — rien ne sort d'ici.</p>
  </header>

  <nav id="nav" role="tablist" aria-label="Outils"></nav>
  <main id="vue"></main>

  <footer>
    Bazin en gros · Ouagadougou · francs CFA<br>
    Aucune donnée envoyée. Tes chiffres restent enregistrés sur cet appareil.
  </footer>
</div>

const MOTS = {
  interruption: ["arrête","arrete","arrêtez","stop","attention","jamais","personne","erreur","erreurs","secret","vérité","verite","attends","surtout pas","oublie","piège","piege","arnaque"],

  cta: ["commente","commentez","écris","ecris","écrivez","ecrivez","dm","message privé","message prive","lien en bio","en bio","abonne","partage","enregistre","clique","whatsapp","appelle","réserve","reserve"],

const bas = (t) => (t || "").toLowerCase();
const trouve = (t, liste) => liste.filter((m) => bas(t).includes(m));
const nbMots = (t) => (t || "").trim().split(/\s+/).filter(Boolean).length;
const borne = (n) => Math.max(0, Math.min(100, Math.round(n)));
const fr = (n) => Math.round(n).toLocaleString("fr-FR");
const fcfa = (n) => fr(n) + " F";
const dec1 = (n) => n.toFixed(1).replace(".", ",");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function analyser(e) {
  const C = [];
  const tout = e.hook + "\n" + e.script + "\n" + e.legende;

  // Accroche
  {
    const o = [], f = [];
    let s = 40;
    const m = nbMots(e.hook);
    if (!e.hook.trim()) {
      C.push({ id: "hook", nom: "Accroche (0-3 s)", p: 28, s: 0, role: "Décide si TikTok montre la vidéo à plus de monde.", o: [], f: ["Écris une accroche : c'est 80 % du résultat. Sans elle, rien ne part."] });
    } else {
      if (m >= 3 && m <= 12) { s += 15; o.push("Accroche courte (" + m + " mots) — elle tient en 3 secondes."); }
      else if (m > 12) { s -= 10; f.push("Accroche trop longue (" + m + " mots). Coupe à 8-12 mots : on doit pouvoir la dire en 3 secondes."); }
      else f.push("Accroche trop courte pour créer une tension. Vise 6 à 12 mots.");
      const i = trouve(e.hook, MOTS.interruption);
      if (i.length) { s += 14; o.push("Rupture de scroll détectée : « " + i[0] + " »."); }
      else f.push("Ajoute un mot qui casse le scroll : « arrête », « erreur », « personne ne », « jamais ».");
      if (trouve(e.hook, MOTS.curiosite).length) { s += 12; o.push("L'accroche ouvre une boucle : le spectateur veut la réponse."); }
      else f.push("Promets une information qu'il n'aura qu'en restant (« voici pourquoi… », « ce détail change tout »).");
      if (/\d/.test(e.hook)) { s += 8; o.push("Présence d'un chiffre — le cerveau s'accroche aux chiffres."); }
      else f.push("Mets un chiffre concret : un prix, une durée, un nombre d'erreurs.");
      if (/\b(tu|toi|ton|ta|tes|vous|votre|vos)\b/i.test(e.hook)) { s += 8; o.push("Adresse directe au spectateur."); }
      else f.push("Parle à UNE personne : « toi qui… », « si tu… ». Pas « les gens ».");
      if (e.hook.includes("?")) { s += 5; o.push("Question posée dès la première seconde."); }
      const w = trouve(e.hook, MOTS.faible);
      if (w.length) { s -= 30; f.push("Supprime « " + w[0] + " ». Les politesses tuent la rétention : entre directement dans le sujet."); }
      C.push({ id: "hook", nom: "Accroche (0-3 s)", p: 28, s: borne(s), role: "Décide si TikTok montre la vidéo à plus de monde.", o, f });
    }
  }

  // Rétention
  {
    const o = [], f = [];
    let s = 45;
    if (!e.script.trim()) {
      C.push({ id: "ret", nom: "Rétention", p: 22, s: 0, role: "Fait regarder jusqu'au bout — c'est ce qui déclenche la vague de vues.", o: [], f: ["Écris le script plan par plan pour contrôler le rythme."] });
    } else {
      const parle = nbMots(e.script) / 2.5;
      const r = e.duree > 0 ? parle / e.duree : 1;
      if (r > 1.2) { s -= 12; f.push("Trop de texte pour " + e.duree + " s (il en faudrait ~" + Math.round(parle) + "). Coupe " + Math.round((r - 1) * 100) + " % ou allonge la vidéo."); }
      else if (r < 0.5) { s -= 6; f.push("Beaucoup de silence pour cette durée. Raccourcis la vidéo ou ajoute du contenu : les temps morts font scroller."); }
      else { s += 12; o.push("Densité de parole cohérente avec la durée."); }
      const b = trouve(e.script, MOTS.boucle);
      if (b.length >= 3) { s += 16; o.push(b.length + " relances de tension détectées."); }
      else if (b.length) { s += 8; o.push("Quelques relances présentes."); f.push("Ajoute une relance toutes les 5 secondes : « mais attends », « sauf que… », « et le pire »."); }
      else f.push("Aucune relance : le spectateur décroche vers la 5ᵉ seconde. Place un « mais » ou un « sauf que » régulièrement.");
      const lignes = e.script.split(/\n+/).filter((l) => l.trim());
      if (lignes.length >= 4) { s += 12; o.push(lignes.length + " plans — le changement d'image relance l'attention."); }
      else f.push("Découpe en au moins 4 plans. Un plan fixe de 30 s perd la moitié de l'audience.");
      if (/\b(avant|après|apres)\b/i.test(e.script)) { s += 8; o.push("Structure avant/après — format à très forte rétention."); }
      if (/\b(1|2|3|premier|deuxième|troisième|étape|etape)\b/i.test(e.script)) { s += 7; o.push("Progression numérotée : on reste pour connaître la suite."); }
      C.push({ id: "ret", nom: "Rétention", p: 22, s: borne(s), role: "Fait regarder jusqu'au bout — c'est ce qui déclenche la vague de vues.", o, f });
    }
  }

  // Freins de distribution
  {
    const o = [], f = [];
    let s = 100;
    const suites = tout.match(/\+?\d[\d\s.-]{6,}\d/g) || [];
    const tel = suites.filter((x) => x.replace(/\D/g, "").length >= 8);
    if (tel.length) { s -= 40; f.push("Un numéro apparaît (« " + tel[0].trim() + " »). C'est le frein le plus coûteux : TikTok réduit la portée de tout ce qui fait sortir de l'application. Mets-le dans le lien de ton profil."); }
    else o.push("Aucun numéro de téléphone dans le texte.");
    if (/instagram|facebook|snapchat|telegram|https?:\/\/|www\.|\.com\b|\.fr\b/i.test(tout)) { s -= 25; f.push("Tu renvoies vers une autre plateforme. Un seul chemin de sortie, et il est dans ta bio."); }
    else o.push("Aucun renvoi vers une plateforme concurrente.");
    const sv = trouve(tout, MOTS.survente);
    if (sv.length) { s -= 15; f.push("« " + sv[0] + " » appartient au vocabulaire du spam. Remplace l'affirmation par la preuve : montre le tissu au lieu de dire qu'il est le meilleur."); }
    else o.push("Pas de survente : le texte reste crédible.");
    C.push({ id: "dist", nom: "Freins de distribution", p: 15, s: borne(s), role: "Détermine si TikTok accepte de montrer la vidéo, avant même sa qualité.", o, f });
  }

  // Conversion
  {
    const o = [], f = [];
    let s = 30;
    const c = trouve(e.script + "\n" + e.legende, MOTS.cta);
    if (c.length) { s += 28; o.push("Appel à l'action présent : « " + c[0] + " »."); }
    else f.push("Aucun appel à l'action. Une vue sans instruction ne rapporte rien : termine par « écris PRIX en commentaire ».");
    if (c.length > 3) { s -= 12; f.push("Trop d'appels à l'action différents. Un seul par vidéo, sinon personne n'en fait aucun."); }
    if (/\b(commente|commentez|écris|ecris|écrivez|ecrivez)\b/i.test(tout)) { s += 16; o.push("Commentaire demandé — conversion et signal algorithmique en même temps."); }
    else f.push("Demande un mot-clé en commentaire. Ça déclenche l'algorithme ET remplit tes messages.");
    if (trouve(tout, MOTS.urgence).length) { s += 14; o.push("Notion d'urgence ou de rareté présente."); }
    else f.push("Ajoute une raison d'agir maintenant : stock limité, prix jusqu'à dimanche, arrivage qui part.");
    if (/\b(bio|whatsapp|lien|dm|message)\b/i.test(tout)) { s += 12; o.push("Chemin de contact explicite."); }
    else f.push("Dis où te joindre. « Lien WhatsApp en bio » doit être prononcé à voix haute, pas seulement écrit.");
    C.push({ id: "conv", nom: "Conversion", p: 13, s: borne(s), role: "Transforme l'audience en messages, puis en commandes.", o, f });
  }

  // Émotion
  {
    const o = [], f = [];
    let s = 40;
    const em = trouve(tout, MOTS.emotion);
    if (em.length >= 2) { s += 22; o.push("Charge émotionnelle forte (« " + em.slice(0, 2).join(" », « ") + " »)."); }
    else if (em.length) { s += 10; o.push("Une note émotionnelle présente."); f.push("Monte d'un cran : raconte ce que tu as ressenti, pas seulement ce que tu as fait."); }
    else f.push("Contenu trop neutre pour être partagé. On partage ce qui fait réagir : une fierté, une galère, une surprise.");
    if (trouve(tout, MOTS.argent).length) { s += 14; o.push("Le sujet touche à l'argent — fort taux de commentaires."); }
    else f.push("Parle du prix ou du coût réel : c'est le sujet qui déclenche le plus de commentaires.");
    if (/\b(je|j'|mon|ma|mes)\b/i.test(tout)) { s += 12; o.push("Récit à la première personne — crée de l'attachement."); }
    else f.push("Passe à la première personne : on suit une personne, pas une marque.");
    if (/\b(toi aussi|comme moi|si tu es|vous aussi|on est nombreux)\b/i.test(tout)) { s += 12; o.push("Effet miroir : le spectateur se reconnaît et envoie la vidéo à un proche."); }
    else f.push("Ajoute une phrase d'identification (« si toi aussi tu… ») : c'est ce qui déclenche l'envoi en privé.");
    C.push({ id: "emo", nom: "Émotion & partage", p: 12, s: borne(s), role: "Pousse la vidéo au-delà de tes abonnés.", o, f });
  }

  // Découvrabilité
  {
    const o = [], f = [];
    let s = 40;
    const tags = e.hashtags.split(/[\s,]+/).filter((t) => t.startsWith("#") && t.length > 1);
    if (tags.length >= 3 && tags.length <= 6) { s += 20; o.push(tags.length + " hashtags — dans la zone idéale."); }
    else if (tags.length > 6) { s -= 8; f.push(tags.length + " hashtags, c'est trop : TikTok dilue le classement. Garde les 5 meilleurs."); }
    else f.push("Mets 3 à 6 hashtags : 1 large, 2 moyens, 3 de niche.");
    if (tags.some((t) => t.length >= 12)) { s += 15; o.push("Au moins un hashtag de niche — c'est là que tu peux te classer."); }
    else f.push("Ajoute un hashtag long et spécifique (#fasodanfani, #bazinriche). Sur #mode tu es invisible.");
    const nb = e.legende.replace(/#\w+/g, "").trim().length;
    if (nb >= 40 && nb <= 200) { s += 15; o.push("Légende de bonne longueur — assez de texte pour être indexée."); }
    else if (nb < 40) f.push("Légende trop courte. Écris une phrase contenant ce que les gens tapent (« bazin riche gros Ouaga prix »).");
    else f.push("Légende trop longue : elle est coupée. Va à l'essentiel en 2 lignes.");
    const cles = bas(e.hook).split(/\s+/).filter((m) => m.length > 4);
    if (cles.some((m) => bas(e.legende).includes(m))) { s += 12; o.push("Le mot-clé principal est dit ET écrit — TikTok le comprend deux fois."); }
    else f.push("Reprends dans la légende le mot-clé que tu prononces : TikTok transcrit l'audio et croise les deux.");
    C.push({ id: "seo", nom: "Découvrabilité", p: 6, s: borne(s), role: "Fait revenir des vues pendant des mois via la recherche.", o, f });
  }

  // Format
  {
    const o = [], f = [];
    let s = 50;
    const d = e.duree;
    if (d >= 15 && d <= 34) { s += 30; o.push(d + " s — durée idéale : assez long pour convaincre, assez court pour être fini."); }
    else if (d >= 7 && d < 15) { s += 22; o.push(d + " s — format court : excellent taux de complétion."); }
    else if (d > 34 && d <= 60) { s += 10; o.push(d + " s — jouable, mais chaque seconde doit être justifiée."); f.push("Au-delà de 34 s, coupe tout ce qui n'est pas indispensable."); }
    else if (d > 60) { s -= 15; f.push(d + " s, c'est long : le taux de complétion s'effondre. Découpe en 2 vidéos."); }
    else f.push("Moins de 7 s : pas le temps de vendre. Vise 15 à 30 s.");
    if (/\b(texte|sous-titre|à l'écran|a l'ecran)\b/i.test(tout)) { s += 10; o.push("Texte à l'écran prévu — la majorité regarde sans le son."); }
    else f.push("Prévois un texte à l'écran sur chaque plan : beaucoup regardent sans le son.");
    if (/\b(son|musique|audio|tendance)\b/i.test(tout)) { s += 10; o.push("Un son est prévu."); }
    else f.push("Choisis un son tendance (moins de 10 000 vidéos) : c'est un accélérateur gratuit.");
    C.push({ id: "fmt", nom: "Format technique", p: 4, s: borne(s), role: "Durée, texte à l'écran, son.", o, f });
  }

  const tot = C.reduce((a, c) => a + c.p, 0);
  const score = Math.round(C.reduce((a, c) => a + c.s * c.p, 0) / tot);
  const pire = C.slice().sort((a, b) => (100 - b.s) * b.p - (100 - a.s) * a.p)[0];

  let mention, couleur, vues;
  if (score < 35) { mention = "À réécrire"; couleur = "var(--crit)"; vues = [100, 1000]; }
  else if (score < 50) { mention = "Faible"; couleur = "var(--warn)"; vues = [500, 4000]; }
  else if (score < 65) { mention = "Correct"; couleur = "var(--mid)"; vues = [2000, 20000]; }
  else if (score < 78) { mention = "Bon"; couleur = "var(--ok)"; vues = [10000, 80000]; }
  else if (score < 88) { mention = "Très bon"; couleur = "var(--ok)"; vues = [30000, 250000]; }
  else { mention = "Potentiel viral"; couleur = "var(--ok)"; vues = [80000, 1000000]; }

  return { score, mention, couleur, criteres: C, vues, priorite: pire.f[0] || ("Continue : « " + pire.nom + " » est déjà solide.") };
}

function diagnostiquer(ab, vu, coches) {
  const taux = ab > 0 ? (vu / ab) * 100 : 0;
  let niveau, couleur, verdict;
  if (taux < 5) {
    niveau = "Distribution bloquée"; couleur = "var(--crit)";
    verdict = "Tes vidéos ne sont même pas montrées à tes propres abonnés. Publier davantage ne changera rien tant que ce blocage n'est pas levé : chaque nouvelle vidéo ira mourir au même niveau.";
  } else if (taux < 15) {
    niveau = "Distribution faible"; couleur = "var(--warn)";
    verdict = "Tu touches une petite partie de tes abonnés et presque personne en dehors. Il reste des freins à lever avant que le volume de publication serve à quelque chose.";
  } else if (taux < 40) {
    niveau = "Distribution normale"; couleur = "var(--mid)";
    verdict = "Tes vidéos sortent correctement auprès de tes abonnés. Ce sont maintenant l'accroche et la rétention qui décident si tu dépasses ton audience.";
  } else {
    niveau = "Bonne distribution"; couleur = "var(--ok)";
    verdict = "TikTok te pousse au-delà de tes abonnés. Ton travail maintenant est la conversion : transformer ces vues en messages puis en commandes.";
  }
  const actifs = FREINS.filter((f) => coches.includes(f.id)).sort((a, b) => b.p - a.p);
  const comp = [Math.round(ab * 0.15), Math.round(ab * 0.3)];
  return { taux, niveau, couleur, verdict, risque: actifs.reduce((s, f) => s + f.p, 0), actifs,
    comp, mult: vu > 0 ? [comp[0] / vu, comp[1] / vu] : [0, 0] };
}

function simuler(e) {
  const SEM = 4.33;
  const base = (x) => {
    const vues = x.videos * SEM * x.vuesMoy;
    const vis = vues * (x.tProfil / 100);
    const con = vis * (x.tContact / 100);
    const ven = con * (x.tConv / 100);
    return { vues, vis, con, ven, ca: ven * x.panier, marge: ven * x.panier * (x.marge / 100) };
  };
  const b = base(e);
  const regime = (x) => { const y = base(x); return y.ven * (1 + x.rachats) * x.panier * (x.marge / 100); };
  const rBase = regime(e);
  const leviers = [
    ["vuesMoy", "Vues moyennes par vidéo", "Travaille l'accroche des 3 premières secondes. C'est le seul levier qui bouge les vues."],
    ["videos", "Vidéos par semaine", "Filme 5 vidéos d'un coup le même jour, publie-les sur la semaine. Le volume bat la perfection."],
    ["tProfil", "Taux de visite du profil", "Dis à voix haute « va voir mon profil » et montre ton nom à l'écran à la fin."],
    ["tContact", "Taux de prise de contact", "Un seul appel à l'action, très simple. Réponds dans l'heure."],
    ["tConv", "Taux de conversion en vente", "Réponds vite, envoie une photo réelle et propose 2 options de prix, pas 10."],
    ["panier", "Panier moyen", "Propose systématiquement une pièce complémentaire au moment de la commande."],
    ["rachats", "Rachats par an d'une revendeuse", "Écris-lui 3 semaines après sa commande, avant qu'elle ne cherche ailleurs."],
    ["marge", "Marge nette", "Négocie le tissu au volume et regroupe tes achats fournisseurs."],
  ].map(([k, nom, conseil]) => {
    const m = Object.assign({}, e); m[k] = e[k] * 1.2;
    return { nom, conseil, gain: Math.round(regime(m) - rBase) };
  }).sort((a, b2) => b2.gain - a.gain);

  const fac = (f) => Object.assign({}, e, { tProfil: e.tProfil * f, tContact: e.tContact * f, tConv: e.tConv * f });
  const videosMois = Math.round(e.videos * SEM);

  return {
    entonnoir: [

function composerTags(ville, motsCles, graine) {
  const geo = GEO[ville] || [];
  const rot = (l, n, d) => l.length ? Array.from({ length: Math.min(n, l.length) }, (_, i) => l[(d + i) % l.length]) : [];
  const perso = motsCles.map((m) => "#" + m.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-zA-Z0-9]/g, "").toLowerCase())
    .filter((t) => t.length > 1)
    .map((t) => [t, "niche", "Ton mot-clé : c'est ce que tapent les gens qui cherchent exactement ton produit."]);
  const out = [].concat(
    rot(LARGES, 1, graine),
    rot(MOYENS, 1, graine),
    rot(geo.filter((t) => t[1] === "moyen"), 1, graine),
    perso.slice(0, 1),
    rot(NICHES, perso.length ? 1 : 2, graine),
    rot(geo.filter((t) => t[1] === "niche"), 1, graine)
  ).filter(Boolean).slice(0, 6);
  return out;
}

function genererPlan(o) {
  const jours = [];
  const inter = 7 / Math.max(1, Math.min(7, o.rythme));
  const total = Math.floor(30 / inter);
  const catsPar = { attirer: ["curiosite", "contrarian", "liste"], convaincre: ["douleur", "argent", "liste"],
    prouver: ["preuve", "histoire"], vendre: ["urgence", "argent"] };
  for (let i = 0; i < total; i++) {
    const d = new Date(); d.setDate(d.getDate() + Math.round(i * inter));
    const pid = SEQUENCE[i % SEQUENCE.length];
    const pil = PILIERS.find((p) => p.id === pid);
    const cands = HOOKS.filter((h) => catsPar[pid].includes(h[1]));
    const cr = pid === "vendre" ? CRENEAUX[3] : CRENEAUX[i % 3];
    jours.push({ n: i + 1,
      date: d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" }),
      pilier: pil, format: pil.formats[i % pil.formats.length],
      hook: remplir(cands[i % cands.length][0]), creneau: cr[0], note: cr[1] });
  }
  return jours;
}

      '<div style="font-style:italic;color:var(--brass-ink);line-height:1.5;margin-bottom:5px">« ' + esc(x.hook) + ' »</div>' +
      '<div class="aide" style="margin:0">' + x.pilier.obj + "</div></div></div></div>").join("");
},

/* ─────────── Hashtags ─────────── */
tags() {
  const t = composerTags(S.ville in GEO ? S.ville : "Ouagadougou", S.motsTags.split(/[\s,]+/).filter(Boolean), S.graine);
  const noms = { large: "Large", moyen: "Moyen", niche: "Niche" };
  return '<div class="carte"><h2>Hashtags</h2>' +
    '<p class="aide">L\'erreur classique : mettre quinze hashtags énormes. Sur #mode tu es en concurrence avec des millions de vidéos et tu n\'apparais nulle part. Le mélange ci-dessous te fait exister sur les tags où tu peux réellement te classer — et c\'est là que se trouvent les gens qui achètent.</p>' +
    '<div class="grille">' +
      '<div class="champ"><label for="f-villeTag">Ta zone</label><select id="f-villeTag" data-txt="ville">' +
      Object.keys(GEO).map((v) => '<option value="' + v + '"' + (S.ville === v ? " selected" : "") + ">" + v + "</option>").join("") + "</select></div>" +
      champTxt("motsTags", "Tes mots-clés produit", S.motsTags, "bazin riche") +
    "</div>" +
    '<div class="bloc-tags" style="margin-top:14px">' + t.map((x) => x[0]).join(" ") + "</div>" +
    '<div class="actions"><button class="btn" data-copier="' + esc(t.map((x) => x[0]).join(" ")) + '">Copier</button>' +
    '<button class="btn ghost" id="autreTag">Autre combinaison</button></div>' +
    '<div style="margin-top:16px">' + t.map((x) =>
      '<div class="ligne"><div><div class="lbl" style="font-family:var(--mono);color:var(--brass-ink)">' + x[0] + "</div>" +
      '<div class="det">' + x[2] + "</div></div>" +
      '<div class="det" style="text-transform:uppercase;letter-spacing:.06em;font-size:.7rem">' + noms[x[1]] + "</div></div>").join("") + "</div>" +
    '<p class="rappel">1 hashtag large pour la portée, 2 moyens pour le contexte, 3 de niche pour te classer réellement. Change de combinaison d\'une vidéo à l\'autre : republier les mêmes tags finit par plafonner ta distribution.</p></div>';
},

/* ─────────── Revenus ─────────── */
eco() {
  const C = [["videos", "Vidéos par semaine", "En dessous de 4, l'algorithme ne te connaît pas assez.", 1],
    ["vuesMoy", "Vues moyennes par vidéo", "La moyenne de tes 10 dernières, pas ton record.", 10],
    ["tProfil", "Visites de profil (% des vues)", "Visible dans tes statistiques TikTok.", 0.5],
    ["tContact", "Prise de contact (% des visiteurs)", "Ceux qui commentent, écrivent ou cliquent sur WhatsApp.", 1],
    ["tConv", "Conversion en vente (% des contacts)", "Sur 10 personnes qui t'écrivent, combien commandent ?", 1],
    ["panier", "Panier moyen (F CFA)", "Montant moyen d'une commande.", 1000],
    ["marge", "Marge nette (%)", "Ce qu'il te reste après le tissu, le transport et ton temps.", 5],
    ["rachats", "Rachats par an d'une cliente", "Une revendeuse se réapprovisionne. Une particulière achète 1 ou 2 fois.", 1]];
  return '<div class="carte"><h2>Simulateur de revenus</h2>' +
    '<p class="aide">Chaque franc vient d\'une multiplication que tu peux vérifier ligne par ligne. Rien n\'est promis. Mets tes vrais chiffres : un simulateur optimiste ne t\'aide pas à décider.</p>' +
    '<div class="grille">' + C.map(([k, l, a, p]) =>
      '<div class="champ"><label for="f-' + k + '">' + l + '</label><input id="f-' + k + '" type="number" min="0" step="' + p + '" value="' + S.eco[k] + '" data-eco="' + k + '"><span class="note">' + a + "</span></div>").join("") +
    "</div></div><div id=\"out\"></div>";
},
ecoOut() {
  const r = simuler(S.eco);
  let h = '<div class="carte"><h2>Ton entonnoir, mois par mois</h2>' +
    r.entonnoir.map(([l, v, d]) => ligne(l, d, fr(v))).join("") +
    '<div class="encadre"><div class="chiffre">' + fcfa(r.total) + '</div><div class="lg">de revenu net par mois · soit ' + fcfa(r.parVideo) + " par vidéo publiée</div></div>" +
    ligne("Chiffre d'affaires", "", fcfa(r.ca)) + "</div>";

  h += '<div class="carte"><h2>Ce que vaut vraiment une revendeuse</h2>' +
    '<p class="aide">Le chiffre ci-dessus ne compte que les nouvelles clientes du mois. Or une revendeuse ne commande pas une fois : elle se réapprovisionne. C\'est ce qui change tout entre vendre au détail et vendre en gros.</p>' +
    ligne("Une revendeuse gagnée ce mois-ci", "te rapporte sur 12 mois, en marge nette", fcfa(r.valeur12), "var(--ok)") +
    '<div class="encadre"><div class="chiffre">' + fcfa(r.regime) + '</div><div class="lg">par mois en régime établi — au bout d\'environ un an, quand les anciennes revendeuses rachètent pendant que de nouvelles arrivent</div></div>' +
    '<p class="rappel">Si une revendeuse vaut ' + fcfa(r.valeur12) + " sur l'année, il est rentable de passer du temps à la garder : un message trois semaines après sa commande coûte dix fois moins cher que d'en trouver une nouvelle.</p></div>";

  h += '<div class="carte"><h2>Trois scénarios</h2><p class="aide">Même volume de publication. Ce qui change, c\'est la qualité de ton suivi.</p>' +
    r.scenarios.map(([n, v, note]) => ligne(n, note, fcfa(v))).join("") + "</div>";

  h += '<div class="carte"><h2>Où mettre ton énergie</h2>' +
    '<p class="aide">Si tu améliores un seul chiffre de 20 %, voilà ce que ça rapporte en plus par mois en régime établi. Commence par le haut.</p>' +
    r.leviers.map((l) => '<div class="ligne"><div><div class="lbl">' + l.nom + '</div><div class="det">' + l.conseil + "</div></div>" +
      '<div class="val" style="color:var(--ok)">+' + fcfa(l.gain) + "</div></div>").join("") + "</div>";

  h += '<p class="rappel">Le Fonds Créateur de TikTok (rémunération aux vues) n\'existe pas au Burkina Faso. L\'argent vient de tes ventes, des partenariats et de l\'affiliation — jamais des vues elles-mêmes. C\'est pourquoi ce simulateur ne compte aucun revenu par vue.</p>';
  return h;
},
};

/* ═══════════════ Fragments ═══════════════ */

function champNum(k, l, v, p) {
  return '<div class="champ"><label for="f-' + k + '">' + l + '</label><input id="f-' + k + '" type="number" min="0" step="' + p + '" value="' + v + '" data-num="' + k + '"></div>';
}
function champTxt(k, l, v, ph) {
  return '<div class="champ"><label for="f-' + k + '">' + l + '</label><input id="f-' + k + '" type="text" value="' + esc(v) + '" placeholder="' + esc(ph) + '" data-txt="' + k + '"></div>';
}
function champAire(k, l, v, ph) {
  return '<div class="champ"><label for="f-' + k + '">' + l + '</label><textarea id="f-' + k + '" rows="3" placeholder="' + esc(ph) + '" data-txt="' + k + '">' + esc(v) + "</textarea></div>";
}
function ligne(l, d, v, couleur) {
  return '<div class="ligne"><div><div class="lbl">' + l + "</div>" + (d ? '<div class="det">' + d + "</div>" : "") + "</div>" +
    (v ? '<div class="val"' + (couleur ? ' style="color:' + couleur + '"' : "") + ">" + v + "</div>" : "") + "</div>";
}

/* ═══════════════ Boucle ═══════════════ */

function maj() {
  const o = $("#out");
  if (S.onglet === "diag" && o) o.innerHTML = VUES.diagOut();
  else if (S.onglet === "analyse" && o) o.innerHTML = VUES.analyseOut();
  else if (S.onglet === "eco" && o) o.innerHTML = VUES.ecoOut();
  else if (S.onglet === "profil") VUES.profilOut();
  sauver();
}

function rendre() {
  nav();
  vue.innerHTML = VUES[S.onglet]();
  maj();
  window.scrollTo({ top: 0, behavior: "instant" });
}

document.addEventListener("input", (ev) => {
  const t = ev.target;
  if (t.dataset.num) { S[t.dataset.num] = Number(t.value) || 0; if (t.dataset.num === "rythme") return rendre(); maj(); }
  else if (t.dataset.txt) { S[t.dataset.txt] = t.value; if (t.dataset.txt === "ville" || t.dataset.txt === "motsTags") return rendre(); maj(); }
  else if (t.dataset.eco) { S.eco[t.dataset.eco] = Number(t.value) || 0; maj(); }
});

document.addEventListener("change", (ev) => {
  const f = ev.target.dataset.frein;
  if (!f) return;
  S.freins = ev.target.checked ? S.freins.concat([f]) : S.freins.filter((x) => x !== f);
  maj();
});

document.addEventListener("click", async (ev) => {
  const b = ev.target.closest("button, a");
  if (!b) return;

  if (b.dataset.o) { S.onglet = b.dataset.o; return rendre(); }
  if (b.dataset.cat) { S.cat = b.dataset.cat; return rendre(); }
  if (b.dataset.bio) { S.bio = b.dataset.bio; $("#f-bio").value = S.bio; return maj(); }
  if (b.id === "autreTag") { S.graine++; return rendre(); }
  if (b.id === "vider") { S.hook = S.script = S.legende = S.hashtags = ""; S.duree = 25; return rendre(); }
  if (b.id === "exemple") {
    S.hook = "Arrête de payer 50 000 F pour un bazin qui se froisse.";
    S.script = "Plan 1 — je montre le tissu de près\nRegarde bien la trame. Tu vois cette brillance ?\nPlan 2 — comparaison avec un autre tissu\nMais celui-là c'est du getzner. Et là, c'est de l'imitation.\nPlan 3 — je froisse les deux dans ma main\nSauf que la différence, tu la vois seulement après 2 heures.\nPlan 4 — résultat côte à côte, texte à l'écran\nLe vrai revient à sa forme. L'autre non.\nÉcris VRAI en commentaire, je t'envoie ma liste de prix.";
    S.legende = "Comment reconnaître un vrai bazin riche avant d'acheter — guide rapide pour Ouaga.";
    S.hashtags = "#pourtoi #bazin #ouaga #bazinriche #getzner #fasodanfani";
    S.duree = 28;
    return rendre();
  }
  if (b.id === "copierPlan") {
    const j = genererPlan({ rythme: S.rythme });
    const txt = ["PLAN TIKTOK 30 JOURS — " + S.produit.toUpperCase(), j.length + " vidéos à publier", ""]
      .concat(j.map((x) => "── Vidéo " + x.n + " — " + x.date + " — " + x.creneau +
        "\n   Pilier   : " + x.pilier.nom + "\n   Format   : " + x.format +
        "\n   Accroche : « " + x.hook + " »\n   " + x.pilier.obj + "\n"))
      .concat(["RÈGLE : ne saute pas les vidéos « Attirer » pour publier plus d'offres.",
        "Sans nouvelles vues, il n'y a personne à qui vendre."]).join("\n");
    return copier(txt, b, "Plan copié");
  }
  if (b.dataset.copier) return copier(b.dataset.copier, b, "Copié");
});

async function copier(texte, bouton, libelle) {
  const avant = bouton.textContent;
  try { await navigator.clipboard.writeText(texte); bouton.textContent = libelle; }
  catch (e) { bouton.textContent = "Copie impossible — sélectionne le texte"; }
  setTimeout(() => { bouton.textContent = avant; }, 1700);
}

rendre();
</script>

</body>
</html>
