<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factures & Reçus — Mon Business</title>
<style>
  :root {
    --bg: #f3f5f8; --surface: #ffffff; --surface-2: #eef1f6; --ink: #14213a; --muted: #5c6b86;
    --line: #dde3ec; --accent: #0e9f6e; --accent-ink: #0a7a53; --accent-soft: rgba(14,159,110,0.12);
    --gold: #a97e20; --shadow: 0 1px 2px rgba(20,33,58,0.05), 0 10px 26px rgba(20,33,58,0.07); --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1626; --surface: #172034; --surface-2: #1f2a42; --ink: #e9eff8; --muted: #93a1bd;
      --line: #2a3650; --accent: #22c58a; --accent-ink: #5fe0b0; --accent-soft: rgba(34,197,138,0.15); --gold: #d9ad4e;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 14px 34px rgba(0,0,0,0.4); }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; }
  .num { font-variant-numeric: tabular-nums; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 24px 18px 90px; }
  .app-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  .app-header h1 { font-size: 1.5rem; font-weight: 820; letter-spacing: -0.02em; }
  .app-header .back { color: var(--accent-ink); text-decoration: none; font-weight: 600; font-size: 0.9rem; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-bottom: 16px; }
  .card h2 { font-size: 1rem; font-weight: 750; margin-bottom: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 5px; font-weight: 600; }
  input, select, textarea { width: 100%; background: var(--bg); border: 1.5px solid var(--line); border-radius: 9px; padding: 10px 12px; color: var(--ink); font-family: inherit; font-size: 0.98rem; outline: none; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  .btn { border: none; border-radius: 10px; padding: 11px 18px; font-size: 0.96rem; font-weight: 700; cursor: pointer; font-family: inherit; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-ghost { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }

  /* Lignes */
  .items { display: flex; flex-direction: column; gap: 8px; }
  .item-row { display: grid; grid-template-columns: 1fr 70px 110px 34px; gap: 8px; align-items: center; }
  .item-row .lbl-row { display: none; }
  .del { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 1.1rem; }
  .del:hover { color: #dc2626; }
  @media (max-width: 520px) {
    .item-row { grid-template-columns: 1fr 1fr; grid-auto-rows: auto; gap: 6px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; }
    .item-row input:first-child { grid-column: 1 / -1; }
  }

  /* Aperçu facture */
  .invoice { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px; }
  .inv-top { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-bottom: 2px solid var(--accent); padding-bottom: 18px; margin-bottom: 18px; }
  .inv-top .company { font-size: 1.15rem; font-weight: 820; color: var(--accent-ink); }
  .inv-top .company .sub { font-size: 0.85rem; color: var(--muted); font-weight: 500; white-space: pre-line; margin-top: 4px; }
  .inv-top .meta { text-align: right; font-size: 0.9rem; }
  .inv-top .meta .doc-type { font-size: 1.4rem; font-weight: 850; letter-spacing: -0.02em; text-transform: uppercase; }
  .inv-client { margin-bottom: 16px; font-size: 0.95rem; }
  .inv-client .k { color: var(--muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; }
  table.inv { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
  table.inv th { text-align: left; background: var(--surface-2); padding: 10px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
  table.inv th.r, table.inv td.r { text-align: right; }
  table.inv td { padding: 10px; border-bottom: 1px solid var(--line); }
  .inv-totals { margin-top: 16px; margin-left: auto; width: 260px; max-width: 100%; }
  .inv-totals .line { display: flex; justify-content: space-between; padding: 7px 0; }
  .inv-totals .grand { border-top: 2px solid var(--accent); margin-top: 6px; padding-top: 12px; font-size: 1.25rem; font-weight: 850; color: var(--accent-ink); }
  .inv-foot { margin-top: 24px; font-size: 0.85rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; white-space: pre-line; }

  @media print {
    @page { margin: 14mm; }
    body { background: #fff; color: #000; }
    .app-header, .controls, .noprint { display: none !important; }
    .invoice { border: none; box-shadow: none; border-radius: 0; padding: 0; }
    .wrap { padding: 0; max-width: 100%; }
    .inv-top .company { color: #000; }
    .inv-totals .grand { color: #000; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="app-header">
    <h1>🧾 Factures & Reçus</h1>
    <a class="back" href="/business.html">← Mon Business</a>
  </div>

  <div class="controls">
    <div class="card">
      <h2>1. Mes informations <span style="font-weight:500;color:var(--muted);font-size:0.82rem">(enregistrées pour la prochaine fois)</span></h2>
      <div class="grid">
        <div><label>Nom de ta boutique / entreprise</label><input id="coName" placeholder="Ex. : Bazin Mari Falah"></div>
        <div><label>Téléphone</label><input id="coPhone" placeholder="Ex. : 77 123 45 67"></div>
      </div>
      <div style="margin-top:12px"><label>Adresse / infos (facultatif)</label><input id="coAddr" placeholder="Ex. : Marché Sandaga, Dakar"></div>
    </div>

    <div class="card">
      <h2>2. Le document</h2>
      <div class="grid">
        <div><label>Type</label><select id="docType"><option>FACTURE</option><option>REÇU</option><option>DEVIS</option></select></div>
        <div><label>Numéro</label><input id="docNum"></div>
        <div><label>Date</label><input id="docDate" type="date"></div>
      </div>
      <div class="grid" style="margin-top:12px">
        <div><label>Nom du client</label><input id="clName" placeholder="Ex. : Aïssatou Diallo"></div>
        <div><label>Téléphone client (facultatif)</label><input id="clPhone"></div>
      </div>
    </div>

    <div class="card">
      <h2>3. Les articles</h2>
      <div class="items" id="items"></div>
      <div class="actions" style="margin-top:12px">
        <button class="btn btn-ghost" id="addItem">+ Ajouter une ligne</button>
      </div>
    </div>

    <div class="card">
      <h2>4. Remise & note</h2>
      <div class="grid">
        <div><label>Remise (F) — facultatif</label><input id="discount" type="number" min="0" value="0" inputmode="numeric"></div>
        <div><label>Mode de paiement</label><input id="payment" placeholder="Ex. : Espèces, Wave, Orange Money"></div>
      </div>
      <div style="margin-top:12px"><label>Note de bas de page</label><input id="note" placeholder="Ex. : Merci pour votre confiance !"></div>
    </div>

    <div class="actions noprint" style="margin-bottom:18px">
      <button class="btn btn-primary" id="printBtn">🖨️ Imprimer / Enregistrer en PDF</button>
      <button class="btn btn-ghost" id="newBtn">📄 Nouveau document</button>
    </div>
  </div>

  <!-- Aperçu imprimable -->
  <div class="invoice" id="invoice"></div>
  <p class="noprint" style="text-align:center;color:var(--muted);font-size:0.82rem;margin-top:14px">
    💡 Pour un PDF : clique « Imprimer » puis choisis « Enregistrer en PDF » comme imprimante.
  </p>
</div>

<script>
  "use strict";
  const $ = (id) => document.getElementById(id);
  const F = (n) => (Math.round(Number(n)||0)).toLocaleString("fr-FR").replace(/[  ]/g," ") + " F";
  const esc = (s) => String(s||"").replace(/[&<>"']/g,(c)=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const store = { get(k,fb){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):fb; }catch(e){ return fb; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };

  // Infos société (persistées)
  const co = store.get("factures.company", { name:"", phone:"", addr:"" });
  $("coName").value = co.name; $("coPhone").value = co.phone; $("coAddr").value = co.addr;
  function saveCo(){ store.set("factures.company", { name:$("coName").value, phone:$("coPhone").value, addr:$("coAddr").value }); }
  ["coName","coPhone","coAddr"].forEach(id => $(id).addEventListener("input", () => { saveCo(); render(); }));

  // Numéro auto
  function nextNum(){ let c = store.get("factures.counter", 0) + 1; return c; }
  function setNum(){ const c = store.get("factures.counter", 0) + 1; const y = new Date().getFullYear(); $("docNum").value = y + "-" + String(c).padStart(3,"0"); }
  $("docDate").value = new Date().toISOString().slice(0,10);
  setNum();

  // Lignes d'articles
  let items = [{ desc:"", qty:1, price:0 }];
  function renderItems(){
    const box = $("items");
    box.innerHTML = "";
    items.forEach((it, i) => {
      const row = document.createElement("div");
      row.className = "item-row";
      row.innerHTML =
        `<input placeholder="Description (ex. : Bazin getzner 5m)" value="${esc(it.desc)}" data-k="desc" data-i="${i}">
         <input type="number" min="0" inputmode="numeric" placeholder="Qté" value="${it.qty}" data-k="qty" data-i="${i}">
         <input type="number" min="0" inputmode="numeric" placeholder="Prix unit." value="${it.price}" data-k="price" data-i="${i}">
         <button class="del" data-del="${i}" aria-label="Supprimer">✕</button>`;
      box.appendChild(row);
    });
    box.querySelectorAll("input").forEach(inp => inp.addEventListener("input", (e) => {
      const i = +e.target.dataset.i, k = e.target.dataset.k;
      items[i][k] = k === "desc" ? e.target.value : (parseFloat(e.target.value) || 0);
      render();
    }));
    box.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => {
      items.splice(+b.dataset.del, 1); if (!items.length) items.push({desc:"",qty:1,price:0}); renderItems(); render();
    }));
  }
  $("addItem").addEventListener("click", () => { items.push({ desc:"", qty:1, price:0 }); renderItems(); render(); });

  ["docType","docNum","docDate","clName","clPhone","discount","payment","note"].forEach(id => $(id).addEventListener("input", render));

  function render(){
    const sub = items.reduce((a,it)=> a + (Number(it.qty)||0)*(Number(it.price)||0), 0);
    const disc = parseFloat($("discount").value) || 0;
    const total = Math.max(0, sub - disc);
    const rows = items.filter(it => it.desc || it.qty || it.price).map(it => {
      const lt = (Number(it.qty)||0)*(Number(it.price)||0);
      return `<tr><td>${esc(it.desc)||"—"}</td><td class="r num">${it.qty||0}</td><td class="r num">${F(it.price)}</td><td class="r num">${F(lt)}</td></tr>`;
    }).join("");

    $("invoice").innerHTML =
      `<div class="inv-top">
         <div class="company">${esc($("coName").value)||"Ma boutique"}<div class="sub">${esc($("coPhone").value)}${$("coAddr").value?"\n"+esc($("coAddr").value):""}</div></div>
         <div class="meta">
           <div class="doc-type">${esc($("docType").value)}</div>
           <div class="num">N° ${esc($("docNum").value)}</div>
           <div class="num">${new Date(($("docDate").value||"")+"T12:00:00").toLocaleDateString("fr-FR",{day:"2-digit",month:"long",year:"numeric"})}</div>
         </div>
       </div>
       <div class="inv-client"><span class="k">Client</span><br><b>${esc($("clName").value)||"—"}</b>${$("clPhone").value?" · "+esc($("clPhone").value):""}</div>
       <table class="inv">
         <thead><tr><th>Description</th><th class="r">Qté</th><th class="r">Prix unit.</th><th class="r">Total</th></tr></thead>
         <tbody>${rows||`<tr><td colspan="4" style="color:var(--muted)">Ajoute des articles…</td></tr>`}</tbody>
       </table>
       <div class="inv-totals">
         <div class="line"><span>Sous-total</span><span class="num">${F(sub)}</span></div>
         ${disc>0?`<div class="line"><span>Remise</span><span class="num">− ${F(disc)}</span></div>`:""}
         <div class="line grand"><span>TOTAL</span><span class="num">${F(total)}</span></div>
       </div>
       ${($("payment").value||$("note").value)?`<div class="inv-foot">${$("payment").value?"Paiement : "+esc($("payment").value):""}${$("note").value?"\n"+esc($("note").value):""}</div>`:""}`;
  }

  $("printBtn").addEventListener("click", () => {
    // incrémente le compteur une fois le document imprimé
    store.set("factures.counter", store.get("factures.counter", 0) + 1);
    window.print();
  });
  $("newBtn").addEventListener("click", () => {
    items = [{ desc:"", qty:1, price:0 }];
    $("clName").value = ""; $("clPhone").value = ""; $("discount").value = "0"; $("payment").value=""; $("note").value="";
    $("docDate").value = new Date().toISOString().slice(0,10);
    setNum(); renderItems(); render();
  });

  renderItems();
  render();
</script>
</body>
</html>
